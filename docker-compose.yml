services:
  redis:
    image: redis:7-alpine
    container_name: ledgerguard-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ledgerguard-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      REDIS_URL: redis://redis:6379
      PORT: 3000

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
